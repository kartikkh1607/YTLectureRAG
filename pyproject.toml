[project]
name = "ytrag"
version = "0.1.0"
description = "Timestamp-level RAG over a YouTube DSA lecture playlist"
readme = "README.md"
authors = [
    { name = "kartikkh1607", email = "kartikkhandelwal1234589@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ytrag = "ytrag.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
