[project]
name = "ytrag"
version = "0.1.0"
description = "Timestamp-level RAG over a YouTube DSA lecture playlist"
readme = "README.md"
authors = [
    { name = "kartikkh1607", email = "kartikkhandelwal1234589@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
ytrag = "ytrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"
link-mode = "copy"
